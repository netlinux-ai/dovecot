# Build manifest — replayed by the netlinux dev pipeline.
# Not auto-triggered in GHA; use `gh workflow run release-deb.yml` to
# run manually on a GitHub-hosted runner.
name: Build .deb package (dual-suite)
true:
  push:
    branches:
    - main
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: bookworm
          container: debian:bookworm
        - target: resolute
          container: ubuntu:26.04
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.container }}
    steps:
    - name: Bootstrap container
      run: "apt-get update\napt-get install -y --no-install-recommends \\\n  ca-certificates curl git xz-utils zstd \\\n \
        \ build-essential dpkg-dev sudo\n"
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: "apt-get update\napt-get install -y \\\n  build-essential \\\n  libssl-dev \\\n  libpam0g-dev \\\n  liblz4-dev\
        \ \\\n  liblzma-dev \\\n  libzstd-dev \\\n  libbz2-dev \\\n  zlib1g-dev \\\n  libsqlite3-dev \\\n  libcap-dev \\\n\
        \  libwrap0-dev \\\n  libsystemd-dev \\\n  libexttextcat-dev \\\n  libsodium-dev \\\n  libicu-dev \\\n  libstemmer-dev\
        \ \\\n  libunwind-dev \\\n  libtirpc-dev \\\n  pkg-config \\\n  checkinstall\n"
    - name: Determine version
      id: version
      run: 'UPSTREAM_VER="2.3.21.1"

        rev=${{ github.run_number }}

        echo "upstream=${UPSTREAM_VER}" >> "$GITHUB_OUTPUT"

        echo "version=${UPSTREAM_VER}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"

        echo "tag=v${UPSTREAM_VER}-${rev}netlinux1~${{ matrix.target }}1" >> "$GITHUB_OUTPUT"

        '
    - name: Download and extract source
      run: "curl -sL -o dovecot.tar.gz \\\n  \"https://dovecot.org/releases/2.3/dovecot-${{ steps.version.outputs.upstream\
        \ }}.tar.gz\"\ntar xzf dovecot.tar.gz\nmv dovecot-${{ steps.version.outputs.upstream }} dovecot-src\n"
    - name: Build
      run: "cd dovecot-src\nCPPFLAGS=\"-I/usr/include/tirpc\" \\\nLDFLAGS=\"-ltirpc\" \\\n./configure \\\n  --prefix=/usr\
        \ \\\n  --sysconfdir=/etc \\\n  --localstatedir=/var \\\n  --libexecdir=/usr/lib/dovecot \\\n  --runstatedir=/run\
        \ \\\n  --with-ssl=openssl \\\n  --with-pam \\\n  --with-sqlite \\\n  --with-icu \\\n  --with-stemmer \\\n  --with-sodium\
        \ \\\n  --with-systemd \\\n  --with-lz4 \\\n  --with-zstd \\\n  --with-bzlib \\\n  --disable-static\nmake -j$(nproc)\n"
    - name: Package with checkinstall
      run: "cd dovecot-src\ncheckinstall --default \\\n  --pkgname=dovecot \\\n  --pkgversion=\"${{ steps.version.outputs.version\
        \ }}\" \\\n  --maintainer=\"graham@netlinux.co.uk\" \\\n  --requires=\"libssl3t64,libpam0g,liblz4-1,liblzma5,libzstd1,libbz2-1.0,zlib1g,libsqlite3-0,libcap2,libwrap0,libsystemd0,libexttextcat-2.0-0,libsodium23,libicu74,libstemmer0d,libunwind8,libcrypt1,adduser,openssl\"\
        \ \\\n  --pakdir=.. \\\n  --install=no \\\n  --fstrans=no \\\n  make install\n"
    - name: Repack .deb for reprepro compatibility
      run: "DEB=$(ls dovecot_*.deb)\nchmod 666 \"$DEB\"\nmkdir repack && cd repack\nar x \"../$DEB\"\nfor f in *.zst; do\n\
        \  [ -f \"$f\" ] || continue\n  zstd -d \"$f\"\n  xz \"${f%.zst}\"\n  rm \"$f\"\ndone\nrm \"../$DEB\"\nar rcs \"../$DEB\"\
        \ debian-binary control.tar.xz data.tar.xz\n"
    - uses: actions/upload-artifact@v4
      with:
        name: deb-${{ matrix.target }}
        path: '**/*.deb

          '
        if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Compute tag
      id: tag
      run: echo "tag=v${{ github.run_number }}-dualsuite" >> "$GITHUB_OUTPUT"
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: Build ${{ github.run_number }} (bookworm + resolute)
        body: 'Dual-suite build from commit ${{ github.sha }}.

          Both ~bookworm1 and ~resolute1 .debs are attached.

          '
        files: artifacts/**/*.deb
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Notify package repository
      run: "sleep 5\nPAYLOAD='{\"repo\":\"netlinux-ai/dovecot\",\"tag\":\"${{ steps.tag.outputs.tag }}\"}'\nSIGNATURE=$(echo\
        \ -n \"$PAYLOAD\" \\\n  | openssl dgst -sha256 -hmac \"${{ secrets.WEBHOOK_SECRET }}\" -binary \\\n  | xxd -p -c 256)\n\
        curl -sf -X POST \\\n  -H \"Content-Type: application/json\" \\\n  -H \"X-Webhook-Signature: sha256=${SIGNATURE}\"\
        \ \\\n  -d \"$PAYLOAD\" \\\n  https://packages.netlinux.co.uk/webhook/update-repo\n"
'on':
  workflow_dispatch: null
